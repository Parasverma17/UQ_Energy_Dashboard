services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    container_name: timescaledb
    env_file: .env
    ports:
      - "5424:5432"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db-init:
    build: ./db-init
    env_file: .env
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432" 
      CSV_PATH: /data/data1.csv 
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./timescaledb.py:/app/timescaledb.py:ro
      - ./data:/data:ro
    command: ["python", "/app/timescaledb.py"]
    restart: "no"

volumes:
  tsdb-data: